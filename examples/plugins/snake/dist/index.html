<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>贪吃蛇</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="wrap">
    <div class="hud">
      <div class="stat"><span class="k">SCORE</span><b id="score">0</b></div>
      <div class="stat"><span class="k">BEST</span><b id="best">0</b></div>
      <div class="stat"><span class="k">LV</span><b id="level">1</b></div>
    </div>

    <div class="board" id="board">
      <canvas id="game"></canvas>
      <div class="overlay" id="overlay">
        <div class="ov-title" id="ovTitle">贪吃蛇</div>
        <div class="ov-sub" id="ovSub">轻触棋盘或按方向键开始</div>
      </div>
    </div>

    <div class="controls">
      <div class="dpad" id="dpad">
        <button type="button" class="pad up"    data-dir="up"    aria-label="上">▲</button>
        <button type="button" class="pad left"  data-dir="left"  aria-label="左">◀</button>
        <button type="button" class="pad right" data-dir="right" aria-label="右">▶</button>
        <button type="button" class="pad down"  data-dir="down"  aria-label="下">▼</button>
        <span class="pad-center" aria-hidden="true"></span>
      </div>
      <div class="pills">
        <button type="button" class="pill" id="btnToggle">⏸ 暂停</button>
        <button type="button" class="pill" id="btnReset">↺ 重置</button>
        <button type="button" class="pill" id="btnSound">🔊</button>
      </div>
    </div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
