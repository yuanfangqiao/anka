<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>翻译 · Google Translate</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --text: #1c1b18; --muted: #8a867d;
    --line: #e6e2d9; --accent: #2f6fed; --err: #c0392b; --ok: #2e7d4f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161512; --card: #201e1a; --text: #f0eee8; --muted: #8f8a7f;
      --line: #34302a; --accent: #6b9cf5; --err: #ff7b6b; --ok: #7fd6a4;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 15px/1.65 ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column;
    height: 100dvh;
  }

  /* Chrome（标题 / 语言栏 / 页脚）禁掉 iPadOS 长按 callout，正文区域保留可选中 */
  header, .langbar, .pane-foot, .actions {
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
  }

  header { padding: 14px 18px 10px; display: flex; align-items: baseline; gap: 10px; }
  header h1 { font-size: 17px; margin: 0; letter-spacing: -0.01em; }
  header .sub { color: var(--muted); font-size: 12.5px; }

  main { flex: 1; display: flex; flex-direction: column; padding: 0 18px 16px; min-height: 0; gap: 10px; }

  .langbar { display: flex; align-items: center; gap: 8px; }
  .langbar select {
    flex: 1; min-width: 0;
    appearance: none; -webkit-appearance: none;
    background: var(--card); color: inherit;
    border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 12px; font: inherit; outline: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                      linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 18px) 55%, calc(100% - 13px) 55%;
    background-size: 5px 5px; background-repeat: no-repeat;
  }
  .langbar select:focus { border-color: var(--accent); }
  #swap {
    flex: none; width: 38px; height: 38px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--muted);
    font-size: 17px; line-height: 1; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 160ms ease, color 140ms ease;
  }
  #swap:hover { color: var(--text); }
  #swap:active { transform: rotate(180deg); }

  .panes { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; min-height: 0; }
  .pane {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    display: flex; flex-direction: column; overflow: hidden; min-height: 0;
    transition: border-color 140ms ease;
  }
  .pane:focus-within { border-color: var(--accent); }
  textarea, #out {
    flex: 1; width: 100%; min-height: 0;
    padding: 14px 16px; border: none; outline: none; resize: none;
    background: transparent; color: inherit; font: inherit;
    -webkit-user-select: text; user-select: text;
  }
  textarea::placeholder { color: var(--muted); }
  #out { white-space: pre-wrap; overflow-y: auto; }
  #out:empty::before {
    content: '译文将显示在这里'; color: var(--muted); opacity: .7;
  }

  .pane-foot {
    display: flex; justify-content: space-between; align-items: center;
    padding: 5px 10px; border-top: 1px solid var(--line);
    font-size: 12px; color: var(--muted); gap: 8px;
  }
  .pane-foot .hint { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pane-foot button {
    appearance: none; border: none; background: transparent;
    color: var(--muted); font: inherit; font-size: 12px;
    padding: 4px 8px; border-radius: 7px; cursor: pointer;
    -webkit-tap-highlight-color: transparent; flex: none;
  }
  .pane-foot button:hover { background: color-mix(in srgb, var(--text) 7%, transparent); color: var(--text); }

  .actions { display: flex; align-items: center; gap: 12px; }
  #go {
    appearance: none; border: none; cursor: pointer;
    background: var(--accent); color: #fff;
    font: 600 14.5px/1 inherit; padding: 11px 22px; border-radius: 11px;
    -webkit-tap-highlight-color: transparent;
    display: flex; align-items: center; gap: 8px; flex: none;
    transition: opacity 140ms ease, transform 80ms ease;
  }
  #go:active { transform: scale(.97); }
  #go:disabled { opacity: .45; cursor: default; }
  #go kbd {
    font: 500 10.5px/1 ui-monospace, monospace;
    background: rgba(255,255,255,.18); border-radius: 5px; padding: 3px 5px;
  }
  @media (max-width: 640px) { #go kbd { display: none; } }
  #status { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status.err { color: var(--err); }
  #status.ok { color: var(--ok); }

  @media (max-width: 640px) {
    header { padding-top: 12px; }
    .panes { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; gap: 10px; }
  }
</style>
</head>
<body>
  <header>
    <h1>翻译</h1>
    <span class="sub">Google Translate · translate.googleapis.com</span>
  </header>

  <main>
    <div class="langbar">
      <select id="sl" aria-label="源语言"></select>
      <button id="swap" title="互换语言" aria-label="互换语言">⇄</button>
      <select id="tl" aria-label="目标语言"></select>
    </div>

    <div class="panes">
      <section class="pane">
        <textarea id="src" maxlength="5000" placeholder="输入要翻译的文本…" spellcheck="false"></textarea>
        <div class="pane-foot">
          <span class="hint" id="count">0 / 5000</span>
          <button id="clear" type="button">清空</button>
        </div>
      </section>
      <section class="pane">
        <div id="out" aria-live="polite"></div>
        <div class="pane-foot">
          <span class="hint" id="detected"></span>
          <button id="copy" type="button">复制</button>
        </div>
      </section>
    </div>

    <div class="actions">
      <button id="go" type="button">翻译 <kbd>⌘/Ctrl + ↵</kbd></button>
      <span id="status"></span>
    </div>
  </main>

<script>
'use strict'
const $ = (s) => document.querySelector(s)

const LANGS = [
  ['auto',      '自动检测'],
  ['zh-CN',     '中文（简体）'],
  ['zh-TW',     '中文（繁體）'],
  ['en',        'English'],
  ['ja',        '日本語'],
  ['ko',        '한국어'],
  ['fr',        'Français'],
  ['de',        'Deutsch'],
  ['es',        'Español'],
  ['ru',        'Русский'],
  ['pt',        'Português'],
  ['it',        'Italiano'],
  ['ar',        'العربية'],
  ['th',        'ไทย'],
  ['vi',        'Tiếng Việt'],
  ['id',        'Bahasa Indonesia'],
  ['hi',        'हिन्दी'],
]
const langName = (code) => (LANGS.find((l) => l[0] === code) || [code, code])[1]

// localStorage 与宿主同源共享，key 一律加前缀防串
const LS = { sl: 'gtranslate:sl', tl: 'gtranslate:tl' }

const slSel = $('#sl'), tlSel = $('#tl')
const srcTa = $('#src'), outEl = $('#out')
const countEl = $('#count'), detectedEl = $('#detected'), statusEl = $('#status')
const goBtn = $('#go')

function build(sel, value) {
  for (const [code, name] of LANGS) {
    const o = document.createElement('option')
    o.value = code; o.textContent = name
    sel.append(o)
  }
  sel.value = value
}
build(slSel, localStorage.getItem(LS.sl) || 'auto')
build(tlSel, localStorage.getItem(LS.tl) || 'zh-CN')

// ---- 翻译 -------------------------------------------------------------------
// Google 官方免费端点（client=gtx，浏览器可直接 fetch，已验证 ACAO:*）。
// 返回结构：[[["译文","原文",…],…], null, "检测到的语言", …]
let seq = 0
let lastDetected = null
let timer = null

function setStatus(msg, cls) {
  statusEl.textContent = msg || ''
  statusEl.className = cls || ''
}
function flash(msg) {
  setStatus(msg, 'ok')
  clearTimeout(flash._t)
  flash._t = setTimeout(() => setStatus(''), 1600)
}

async function run() {
  const text = srcTa.value
  if (!text.trim()) { outEl.textContent = ''; detectedEl.textContent = ''; setStatus(''); return }
  const id = ++seq
  goBtn.disabled = true
  setStatus('翻译中…')
  try {
    const url = 'https://translate.googleapis.com/translate_a/single'
      + '?client=gtx&dt=t'
      + '&sl=' + encodeURIComponent(slSel.value)
      + '&tl=' + encodeURIComponent(tlSel.value)
      + '&q='  + encodeURIComponent(text)
    const res = await fetch(url)
    if (!res.ok) throw new Error('HTTP ' + res.status)
    const data = await res.json()
    if (id !== seq) return            // 过期响应，丢弃
    outEl.textContent = (data[0] || []).map((s) => (s && s[0]) || '').join('')
    lastDetected = data[2] || null
    detectedEl.textContent = lastDetected ? '检测到：' + langName(lastDetected) : ''
    setStatus('')
  } catch (e) {
    if (id !== seq) return
    outEl.textContent = ''
    setStatus('无法访问 Google 翻译服务，请检查网络或代理是否开启', 'err')
  } finally {
    if (id === seq) goBtn.disabled = false
  }
}

const schedule = () => { clearTimeout(timer); timer = setTimeout(run, 900) }

srcTa.addEventListener('input', () => {
  countEl.textContent = srcTa.value.length + ' / 5000'
  schedule()
})
srcTa.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); clearTimeout(timer); run() }
})
goBtn.addEventListener('click', () => { clearTimeout(timer); run() })

// ---- 语言切换 / 互换 ---------------------------------------------------------
function saveLangs() {
  localStorage.setItem(LS.sl, slSel.value)
  localStorage.setItem(LS.tl, tlSel.value)
}
slSel.addEventListener('change', () => { saveLangs(); clearTimeout(timer); run() })
tlSel.addEventListener('change', () => { saveLangs(); clearTimeout(timer); run() })

$('#swap').addEventListener('click', () => {
  // 源是「自动检测」时，用刚检测到的语种补位；一次都没有就用英语
  let a = slSel.value
  if (a === 'auto') a = lastDetected || 'en'
  const b = tlSel.value
  if (a === b) return
  slSel.value = b; tlSel.value = a
  saveLangs()
  const t = srcTa.value
  srcTa.value = outEl.textContent
  outEl.textContent = t
  countEl.textContent = srcTa.value.length + ' / 5000'
  clearTimeout(timer); run()
})

// ---- 清空 / 复制 --------------------------------------------------------------
$('#clear').addEventListener('click', () => {
  srcTa.value = ''; outEl.textContent = ''
  detectedEl.textContent = ''; setStatus('')
  countEl.textContent = '0 / 5000'
  lastDetected = null
  srcTa.focus()
})
$('#copy').addEventListener('click', async () => {
  const text = outEl.textContent
  if (!text) return
  try {
    await navigator.clipboard.writeText(text)
    flash('已复制')
  } catch {
    // 剪贴板 API 不可用时退回选中方案
    const r = document.createRange()
    r.selectNodeContents(outEl)
    const s = getSelection(); s.removeAllRanges(); s.addRange(r)
    if (document.execCommand('copy')) flash('已复制')
  }
})
</script>
</body>
</html>
